services:
  # Blue-green deploy creates preprod-api/worker containers dynamically
  # This compose only defines preprod-nginx (the static reverse proxy)
  preprod-nginx:
    image: nginx:alpine
    container_name: preprod-nginx
    hostname: preprod-nginx
    networks:
      - default
    ports:
      - "8090:8090"
    volumes:
      - /opt/healthcare-preprod/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/healthcare-preprod/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
      - /opt/healthcare-preprod/logs/nginx:/var/log/nginx
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  default:
    name: preprod-network
    external: true

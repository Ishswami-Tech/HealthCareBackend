# docker-compose.preprod.yml — Preprod environment services
# Isolated on its own Docker network (preprod-network, subnet 172.19.0.0/16).
# Container name prefix: preprod- (Req 2.2, 7.4)
# Nginx listens on host port 8089 via Traefik routing (Req 7.5)
# Separate data dirs, env file, and key prefix from production.
# Resource limits are reduced vs production (Req 7.6).
services:
  # DATABASE - PostgreSQL 18 (preprod)
  preprod-postgres:
    image: postgres:18
    container_name: preprod-postgres
    hostname: preprod-postgres
    volumes:
      - preprod_postgres_data:/var/lib/postgresql/data/pgdata
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: userdb_preprod
      POSTGRES_MAX_CONNECTIONS: 80
      POSTGRES_SHARED_BUFFERS: 1GB
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      preprod-network:
        ipv4_address: 172.19.0.2
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d userdb_preprod" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 4G
        reservations:
          cpus: "0.75"
          memory: 2G
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 1m
    command: >
      postgres
        -c max_connections=80
        -c shared_buffers=1GB
        -c effective_cache_size=6GB
        -c maintenance_work_mem=128MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=100
        -c work_mem=8MB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c max_worker_processes=4
        -c max_parallel_workers_per_gather=2
        -c max_parallel_workers=4
        -c max_parallel_maintenance_workers=2
        -c idle_in_transaction_session_timeout=60000
        -c statement_timeout=60000
        -c lock_timeout=60000
        -c listen_addresses='*'
        -c log_connections=on
        -c log_disconnections=on
        -c tcp_keepalives_idle=60
        -c tcp_keepalives_interval=10
        -c tcp_keepalives_count=3
    labels:
      - "com.docker.compose.service=postgres"
      - "env=preprod"
      - "app.component=database"
      - "app.type=postgres"
      - "app.healthcheck=enabled"
      - "app.persist=true"

  # CACHE - DragonflyDB (preprod)
  preprod-dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: preprod-dragonfly
    hostname: preprod-dragonfly
    command: >
      --alsologtostderr
      --cache_mode=false
      --maxmemory=2gb
      --proactor_threads=4
      --logtostderr
      --default_lua_flags=allow-undeclared-keys
    volumes:
      - preprod_dragonfly_data:/data
    networks:
      preprod-network:
        ipv4_address: 172.19.0.4
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -p 6379 ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    restart: unless-stopped
    sysctls:
      net.core.somaxconn: 2048
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - "com.docker.compose.service=dragonfly"
      - "env=preprod"
      - "app.component=cache"
      - "app.type=dragonfly"
      - "app.healthcheck=enabled"

  # ROUTER — Nginx (preprod, zero-downtime gateway)
  preprod-nginx:
    image: nginx:alpine
    container_name: preprod-nginx
    hostname: preprod-nginx
    ports:
      - "${NGINX_PORT:-8089}:${NGINX_PORT:-8089}"
    volumes:
      - ${DEPLOY_PATH:-/opt/healthcare-preprod}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${DEPLOY_PATH:-/opt/healthcare-preprod}/nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf
      - ${DEPLOY_PATH:-/opt/healthcare-preprod}/logs/nginx:/var/log/nginx
    networks:
      preprod-network:
        ipv4_address: 172.19.0.7
      coolify:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.1"
          memory: 32M
    labels:
      - "com.docker.compose.service=nginx"
      - "env=preprod"
      - "app.component=router"
      - "app.type=nginx"
      - "traefik.enable=true"
      - "traefik.http.routers.healthcare-api-preprod.rule=Host(\`preprod-backend.ishswami.in\`)"
      - "traefik.http.routers.healthcare-api-preprod.entrypoints=http,https"
      - "traefik.http.routers.healthcare-api-preprod.tls=true"
      - "traefik.http.services.healthcare-api-preprod.loadbalancer.server.port=8089"
      - "traefik.docker.network=coolify"

  # API - NestJS Backend (preprod)
  preprod-api:
    image: ${DOCKER_IMAGE:-ghcr.io/ishswami-tech/healthcarebackend/healthcare-api:preprod}
    container_name: preprod-api
    hostname: api
    env_file:
      - ${DEPLOY_PATH:-/opt/healthcare-preprod}/.env.preprod
    volumes:
      - ${DEPLOY_PATH:-/opt/healthcare-preprod}/logs:/app/logs
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      NODE_ENV: production
      DEV_MODE: "false"
      DOCKER_ENV: "true"
      CRON_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      ENABLE_HTTP2: "false"
      CACHE_PROVIDER: dragonfly
      DRAGONFLY_ENABLED: "true"
      DRAGONFLY_HOST: preprod-dragonfly
      DRAGONFLY_PORT: 6379
      DRAGONFLY_KEY_PREFIX: "healthcare-preprod:"
      TRUST_PROXY: 1
      LOG_LEVEL: info
      ENABLE_AUDIT_LOGS: "true"
      SECURITY_RATE_LIMIT: "true"
      SECURITY_RATE_LIMIT_MAX: 4000
      SECURITY_RATE_LIMIT_WINDOW_MS: 1000
      CACHE_TTL: 3600
      CACHE_PREFIX: "healthcare-preprod:"
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 600
      API_RATE_LIMIT: 1000
      AUTH_RATE_LIMIT: 30
      HEAVY_RATE_LIMIT: 50
      USER_RATE_LIMIT: 500
      HEALTH_RATE_LIMIT: 2000
      NPM_CONFIG_LOGLEVEL: error
    expose:
      - "${API_PORT:-8088}"
    networks:
      preprod-network:
        ipv4_address: 172.19.0.5
        aliases:
          - preprod-backend.ishswami.in
    extra_hosts:
      - "api:172.19.0.5"
      - "postgres:172.19.0.2"
      - "dragonfly:172.19.0.4"
      - "worker:172.19.0.6"
    depends_on:
      preprod-postgres:
        condition: service_healthy
      preprod-dragonfly:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${API_PORT:-8088}/infra-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 4G
        reservations:
          cpus: "0.75"
          memory: 2G
    labels:
      - "com.docker.compose.service=api"
      - "env=preprod"
      - "app.component=backend"
      - "app.type=api"

  # WORKER - Background Job Processor (preprod)
  preprod-worker:
    image: ${DOCKER_IMAGE:-ghcr.io/ishswami-tech/healthcarebackend/healthcare-api:preprod}
    container_name: preprod-worker
    hostname: worker
    env_file:
      - ${DEPLOY_PATH:-/opt/healthcare-preprod}/.env.preprod
    environment:
      NODE_ENV: production
      APP_MODE: worker
      SERVICE_NAME: worker
      DEV_MODE: "false"
      DOCKER_ENV: "true"
      CRON_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      PORT: 8080
      HOST: 0.0.0.0
      CACHE_PROVIDER: dragonfly
      CACHE_ENABLED: "true"
      DRAGONFLY_ENABLED: "true"
      DRAGONFLY_HOST: preprod-dragonfly
      DRAGONFLY_PORT: 6379
      DRAGONFLY_KEY_PREFIX: "healthcare-preprod:"
      BULL_WORKER_CONCURRENCY: "5"
      BULL_MAX_JOBS_PER_WORKER: "50"
      LOG_LEVEL: info
      ENABLE_AUDIT_LOGS: "true"
      ENABLE_BULL_BOARD: "true"
      BULL_BOARD_URL: ${BULL_BOARD_URL:-/queue-dashboard}
      QUEUE_DASHBOARD_USER: ${QUEUE_DASHBOARD_USER:-bullboard_admin}
      QUEUE_DASHBOARD_PASSWORD: ${QUEUE_DASHBOARD_PASSWORD}
    volumes:
      - ${DEPLOY_PATH:-/opt/healthcare-preprod}/logs:/app/logs
    ports:
      - "9091:8080"
    networks:
      preprod-network:
        ipv4_address: 172.19.0.6
        aliases:
          - worker.ishswami.in
    extra_hosts:
      - "worker:172.19.0.6"
      - "postgres:172.19.0.2"
      - "dragonfly:172.19.0.4"
      - "api:172.19.0.5"
    depends_on:
      preprod-postgres:
        condition: service_healthy
      preprod-dragonfly:
        condition: service_healthy
        required: false
      preprod-api:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "dist/worker-bootstrap.js", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    command: ["node", "dist/worker-bootstrap.js"]
    labels:
      - "com.docker.compose.service=worker"
      - "env=preprod"
      - "app.component=worker"
      - "app.type=worker"

volumes:
  preprod_postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_PATH:-/opt/healthcare-preprod}/data/postgres
  preprod_dragonfly_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DEPLOY_PATH:-/opt/healthcare-preprod}/data/dragonfly

networks:
  preprod-network:
    name: preprod-network
    ipam:
      config:
        - subnet: 172.19.0.0/16
  coolify:
    external: true

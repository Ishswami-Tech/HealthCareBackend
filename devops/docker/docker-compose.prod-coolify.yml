services:
  api:
    image: '${DOCKER_IMAGE:-ghcr.io/ishswami-tech/healthcarebackend/healthcare-api:latest}'
    container_name: api-5sdkic5wk4l6zpflypayt9mb
    hostname: api
    env_file:
      - /opt/healthcare-backend/.env.production
      - .env
    environment:
      # Least-privilege app role, stored ONLY as a Coolify secret (never committed).
      DATABASE_URL: '${DATABASE_URL:?DATABASE_URL must be set as a Coolify secret}'
      DRAGONFLY_KEY_PREFIX: 'healthcare:'
      CACHE_PREFIX: 'healthcare:'
      NODE_ENV: production
      APP_MODE: api
      SERVICE_NAME: api
      DEV_MODE: 'false'
      DOCKER_ENV: 'true'
      CRON_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      PORT: 8088
      HOST: 0.0.0.0
      PRISMA_SCHEMA_PATH: /app/src/libs/infrastructure/database/prisma/schema.prisma
      CACHE_PROVIDER: dragonfly
      CACHE_ENABLED: 'true'
      DRAGONFLY_ENABLED: 'true'
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_PORT: 6379
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET must be set as a Coolify secret}'
      ENABLE_HTTP2: 'false'
      # Exactly one trusted proxy hop (Traefik). Use 2 if Cloudflare proxies in front of Traefik.
      TRUSTED_PROXY_HOPS: '${TRUSTED_PROXY_HOPS:-1}'
      # DB pool budget (prod Postgres max_connections=120): api 25 (+2 health) per replica.
      DB_POOL_SIZE: '${API_DB_POOL_SIZE:-25}'
      DB_STATEMENT_TIMEOUT_MS: '15000'
      DB_LOCK_TIMEOUT_MS: '5000'
      LOG_LEVEL: info
      ENABLE_AUDIT_LOGS: 'true'
      CACHE_TTL: 3600
      # Global limiter: per verified user / per anonymous client IP (never IP+User-Agent).
      RATE_LIMIT_USER_MAX: '${RATE_LIMIT_USER_MAX:-300}'
      RATE_LIMIT_ANON_MAX: '${RATE_LIMIT_ANON_MAX:-3000}'
      # Optional: Next.js server egress IP(s), exempt from anonymous per-IP buckets only.
      RATE_LIMIT_TRUSTED_IPS: '${RATE_LIMIT_TRUSTED_IPS:-}'
      API_RATE_LIMIT: 1000
      AUTH_RATE_LIMIT: 30
      HEALTH_RATE_LIMIT: 2000
      NPM_CONFIG_LOGLEVEL: error
    expose:
      - '8088'
    # Traefik reaches the API over the Docker network. The host port is bound to loopback only
    # (host-local health/verify scripts), so the API is NOT reachable from the internet while
    # bypassing Traefik TLS, its middlewares and its client-IP handling.
    ports:
      - '127.0.0.1:8088:8088'
    volumes:
      - '/data/coolify/services/5sdkic5wk4l6zpflypayt9mb/../logs:/app/logs'
    networks:
      5sdkic5wk4l6zpflypayt9mb: null
      coolify: null
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '--spider'
        - 'http://localhost:8088/infra-health'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 2G
    labels:
      - com.docker.compose.service=api
      - env=production
      - traefik.docker.network=coolify
      - app.component=backend
      - app.type=api
      - coolify.managed=true
      - coolify.version=4.3.2
      - coolify.serviceId=3
      - coolify.type=service
      - coolify.name=api-5sdkic5wk4l6zpflypayt9mb
      - coolify.resourceName=docker-api-worker
      - coolify.projectName=healthcarebackend
      - coolify.serviceName=api
      - coolify.environmentName=production
      - coolify.pullRequestId=0
      - coolify.service.subId=9
      - coolify.service.subType=application
      - coolify.service.subName=api

  worker:
    image: '${DOCKER_IMAGE:-ghcr.io/ishswami-tech/healthcarebackend/healthcare-api:latest}'
    container_name: worker-5sdkic5wk4l6zpflypayt9mb
    hostname: worker
    env_file:
      - /opt/healthcare-backend/.env.production
      - .env
    environment:
      # Least-privilege app role, stored ONLY as a Coolify secret (never committed).
      DATABASE_URL: '${DATABASE_URL:?DATABASE_URL must be set as a Coolify secret}'
      DRAGONFLY_KEY_PREFIX: 'healthcare:'
      CACHE_PREFIX: 'healthcare:'
      NODE_ENV: production
      APP_MODE: worker
      SERVICE_NAME: worker
      DEV_MODE: 'false'
      DOCKER_ENV: 'true'
      CRON_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      CACHE_PROVIDER: dragonfly
      CACHE_ENABLED: 'true'
      DRAGONFLY_ENABLED: 'true'
      DRAGONFLY_HOST: dragonfly
      DRAGONFLY_PORT: 6379
      BULL_WORKER_CONCURRENCY: '10'
      BULL_MAX_JOBS_PER_WORKER: '100'
      BULL_STALLED_INTERVAL: '60000'
      BULL_MAX_STALLED_COUNT: '3'
      LOG_LEVEL: info
      ENABLE_AUDIT_LOGS: 'true'
      ENABLE_BULL_BOARD: 'true'
      BULL_BOARD_URL: /queue-dashboard
      # P0-4: Bull Board (PHI job payloads, retry/delete) is NOT mounted in production unless
      # QUEUE_DASHBOARD_ENABLED=true AND Basic-auth credentials (password >= 16 chars) are set.
      QUEUE_DASHBOARD_ENABLED: '${QUEUE_DASHBOARD_ENABLED:-false}'
      QUEUE_DASHBOARD_USER: '${QUEUE_DASHBOARD_USER:-}'
      QUEUE_DASHBOARD_PASSWORD: '${QUEUE_DASHBOARD_PASSWORD:-}'
      QUEUE_DASHBOARD_ALLOWED_IPS: '${QUEUE_DASHBOARD_ALLOWED_IPS:-}'
      TRUSTED_PROXY_HOPS: '${TRUSTED_PROXY_HOPS:-1}'
      DB_POOL_SIZE: '${WORKER_DB_POOL_SIZE:-10}'
      DB_STATEMENT_TIMEOUT_MS: '60000'
      DB_LOCK_TIMEOUT_MS: '5000'
      COOLIFY_RESOURCE_UUID: 5sdkic5wk4l6zpflypayt9mb
      COOLIFY_CONTAINER_NAME: worker-5sdkic5wk4l6zpflypayt9mb
      COOLIFY_FQDN: backend-service-v1.ishswami.in
      COOLIFY_URL: 'https://backend-service-v1.ishswami.in'
      BASE_URL: 'https://backend-service-v1.ishswami.in'
      SERVICE_NAME_API: api
      SERVICE_NAME_WORKER: worker
    volumes:
      - '/data/coolify/services/5sdkic5wk4l6zpflypayt9mb/../logs:/app/logs'
    # Loopback only (see api). Bull Board is reached through Traefik, behind its own auth.
    ports:
      - '127.0.0.1:8089:8088'
    networks:
      5sdkic5wk4l6zpflypayt9mb: null
      coolify: null
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - dist/worker-bootstrap.js
        - --healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 256M
    command:
      - node
      - dist/worker-bootstrap.js
    labels:
      - com.docker.compose.service=worker
      - env=production
      - app.component=worker
      - app.type=worker
      - coolify.managed=true
      - coolify.version=4.3.2
      - coolify.serviceId=3
      - coolify.type=service
      - coolify.name=worker-5sdkic5wk4l6zpflypayt9mb
      - coolify.resourceName=docker-api-worker
      - coolify.projectName=healthcarebackend
      - coolify.serviceName=worker
      - coolify.environmentName=production
      - coolify.pullRequestId=0
      - coolify.service.subId=10
      - coolify.service.subType=application
      - coolify.service.subName=worker
      # Traefik routing: /queue-dashboard/* goes to worker container. The worker only serves the
      # dashboard when QUEUE_DASHBOARD_ENABLED=true (otherwise 404); every request then needs
      # Basic auth and, if QUEUE_DASHBOARD_ALLOWED_IPS is set, an allow-listed client IP.
      # Priority 100 ensures this router wins over the API catch-all (PathPrefix `/`)
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.queue-dashboard.rule=Host(`backend-service-v1.ishswami.in`) && PathPrefix(`/queue-dashboard`)
      - traefik.http.routers.queue-dashboard.priority=100
      - traefik.http.routers.queue-dashboard.entrypoints=https
      - traefik.http.routers.queue-dashboard.tls=true
      - traefik.http.services.queue-dashboard.loadbalancer.server.port=8088

networks:
  5sdkic5wk4l6zpflypayt9mb:
    name: 5sdkic5wk4l6zpflypayt9mb
    external: true
  coolify:
    name: coolify
    external: true

# Nginx reverse proxy for Healthcare Backend API
# Enables zero-downtime blue-green deploys via upstream.conf hot-swap:
#   1. New container starts (latest-api-next)
#   2. Health check passes
#   3. CI writes new upstream.conf -> nginx -s reload (no dropped connections)
#   4. Old container drains (30s grace), removed
#   5. New container renamed to latest-api

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured access log for easy debugging
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time ut="$upstream_response_time" '
                    'uaddr="$upstream_addr" ustat="$upstream_status"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    keepalive_requests 1000;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 1024;

    # Body limits
    client_max_body_size 50m;
    client_body_timeout 60s;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Upstream — dynamically written by CI for zero-downtime deploys
    # File: /opt/healthcare-backend/nginx/upstream.conf
    # Format: server <container-name>:8088 max_fails=3 fail_timeout=10s;
    upstream api_backend {
        include /etc/nginx/conf.d/upstream.conf;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    server {
        listen 8088;
        server_name _;

        # Real client IP (when behind Coolify's Traefik)
        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Nginx self health (does not require API to be up)
        location = /nginx-health {
            access_log off;
            return 200 "nginx-ok\n";
            add_header Content-Type text/plain;
        }

        # WebSocket — Socket.IO (long-lived connections, separate timeout)
        location /socket.io {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # All other traffic (API, health, docs, logger)
        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Request-ID       $request_id;

            # Clear Connection header so keepalive works through proxy
            proxy_set_header Connection "";

            # Retry on upstream errors (enables failover during blue-green switch)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}

# Nginx reverse proxy for Preprod Healthcare Backend API
# Listens on port 8090 — proxies to blue/green-api-preprod via upstream.conf
# ============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time ut="$upstream_response_time" '
                    'uaddr="$upstream_addr" ustat="$upstream_status"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 75;
    keepalive_requests 1000;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css application/xml;
    gzip_min_length 1024;

    client_max_body_size 50m;
    client_body_timeout 60s;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Upstream — dynamically written by CI for zero-downtime deploys
    # File: /opt/healthcare-preprod/nginx/upstream.conf
    # Format: server <container-name>:8088 max_fails=3 fail_timeout=10s;
    # Fallback: default to 127.0.0.1:65535 (unreachable → 502 until blue-green writes upstream)
    upstream api_backend {
        server 127.0.0.1:65535 max_fails=3 fail_timeout=10s;
        include /etc/nginx/conf.d/upstream.conf;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    server {
        listen 8090;
        server_name _;

        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Nginx self health
        location = /nginx-health {
            access_log off;
            return 200 "preprod-nginx-ok\n";
            add_header Content-Type text/plain;
        }

        # WebSocket — Socket.IO
        location /socket.io {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # All other traffic (API, health, docs, queue dashboard)
        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Request-ID       $request_id;
            proxy_set_header Connection "";

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
        }
    }
}

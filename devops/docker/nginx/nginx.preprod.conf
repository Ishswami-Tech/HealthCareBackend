# Preprod nginx configuration
# Reverse proxy for preprod API.
# Routes traffic on port 8090 to the upstream API container defined in upstream.conf.
# Network isolation: this container is on preprod-network only and cannot reach app-network.

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/font-woff application/vnd.ms-fontobject
               image/svg+xml image/x-icon;

    # Upstream backend (defined in upstream.conf, rewritten by blue-green deploy)
    include /etc/nginx/conf.d/upstream.conf;

    # Main server block — reverse proxy to upstream API
    server {
        listen 8090;
        server_name _;

        # Nginx health endpoint (used by Docker healthcheck and CI verify)
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # All other requests proxied to the upstream API
        location / {
            proxy_pass http://preprod_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;
        }
    }
}

# Preprod nginx configuration
# NOTE: This file is no longer actively used.
# Preprod traffic routes through Coolify's Traefik proxy directly.
# Coolify creates a Traefik entrypoint for preprod-backend.ishswami.in
# that proxies to api-ix9fceaxa914diauokjleeis:8080 automatically.
#
# Keep for reference or future use if custom nginx logic is needed.

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/font-woff application/vnd.ms-fontobject
               image/svg+xml image/x-icon;

    # Health check endpoint
    server {
        listen 8090;
        server_name _;

        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}

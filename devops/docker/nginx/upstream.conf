# Upstream Configuration for Nginx — Blue-Green Deployment
# ============================================================================
# This file is dynamically written by blue-green-deploy.sh during each deploy.
# Only ONE color (blue or green) is active at a time. Nginx routes all traffic
# to the active container. The inactive container is NOT running.
#
# DO NOT EDIT MANUALLY — blue-green-deploy.sh rewrites this on every deploy.
# ============================================================================

# --- ACTIVE (written by deploy script) ---
# Example after first deploy (blue active, port 8088):
#   server latest-api-blue:8088 max_fails=3 fail_timeout=10s;

# --- INACTIVE (commented out — container not running) ---
#   # server latest-api-green:8089 max_fails=3 fail_timeout=10s;

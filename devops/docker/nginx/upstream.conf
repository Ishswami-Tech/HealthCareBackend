# Upstream Configuration for Nginx — Blue-Green Deployment
# ----------------------------------------------------------------------------
# This file is written by `blue-green-deploy.sh` after a successful deploy.
# It points Nginx to exactly ONE backend container at a time (the active one).
#
# DO NOT EDIT THIS FILE MANUALLY — it is overwritten by the deploy script.
# During a deploy, the inactive color container runs alongside the active one,
# but Nginx only routes traffic to the active container.
#
# Format: server <container-name>:<port>;
# ----------------------------------------------------------------------------

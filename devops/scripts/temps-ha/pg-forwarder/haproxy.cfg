# Sends every connection to whichever postgres-main member is the primary right now.
# The other apps (governance-ops, vishwayog, social-media) connect to the hostname
# "postgres-postgres-pzxq:5432"; this container answers on that name (network alias),
# so their DATABASE_URL never has to change. Order = preference: temps-worker,
# then Oracle, then contabo-ds. Each member's hcb-pg-role agent says "up" only on the
# primary, so standbys are never used for writes.
global
  log stdout format raw local0
  maxconn 2000

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 3s
  timeout client 2h
  timeout server 2h

frontend pg
  bind :5432
  default_backend pg_primary

backend pg_primary
  balance first
  default-server inter 2s fall 2 rise 1 agent-inter 3s on-marked-down shutdown-sessions
  server temps-worker 10.201.0.5:6261 check agent-check agent-addr 10.201.0.5 agent-port 6268
  server oracle       10.201.0.8:6263 check agent-check agent-addr 10.201.0.8 agent-port 6268
  server contabo-ds   10.201.0.7:6262 check agent-check agent-addr 10.201.0.7 agent-port 6268

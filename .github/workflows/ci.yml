# CI/CD Pipeline - Healthcare Backend
#
# FLOW (push to main):
#   detect-changes + security
#   docker-build (parallel with) ensure-infrastructure-health
#   check-infrastructure (gate)
#   HEALTHY PATH:  -> deploy -> post-deployment-verification + success-backup
#   RECOVERY PATH: -> backup-infrastructure -> recreate-infrastructure
#                  -> restore-backup -> verify-infrastructure-readiness
#                  -> deploy -> post-deployment-verification + success-backup
#
# KEY DESIGN:
#   - HEALTHY: Only api + worker restarted. Infra (postgres/dragonfly) left untouched.
#   - RECOVERY: Only unhealthy infra services recreated (targeted, not all).
#   - All deploys go via SSH to server (not Coolify API).
#   - Rich GITHUB_STEP_SUMMARY and annotations for easy debugging.

name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
      - "**/*.svg"

permissions:
  contents: read
  pull-requests: write
  checks: write
  packages: write
  security-events: write
  actions: read

env:
  NODE_VERSION: "22"
  YARN_VERSION: "1.22.22"
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository }}
  IMAGE_NAME: healthcare-api
  COMPOSE_FILE: devops/docker/docker-compose.prod.yml
  SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=60"

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# JOB: Detect Changes
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
jobs:
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      infra-changed: ${{ steps.filter.outputs.infra }}
      app-changed: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect infrastructure and application changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            infra:
              - 'devops/docker/docker-compose.prod.yml'
              - 'src/libs/infrastructure/database/prisma/migrations/**'
            app:
              - 'src/**'
              - 'package.json'
              - 'yarn.lock'
              - 'tsconfig.json'
              - 'nest-cli.json'
              - 'devops/docker/Dockerfile'

      - name: Change Summary
        run: |
          echo "## Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "| Scope | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ steps.filter.outputs.infra }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Application | ${{ steps.filter.outputs.app }} |" >> $GITHUB_STEP_SUMMARY

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# JOB: Security Scan
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: [detect-changes]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

      - name: Dependency Audit
        run: |
          npx audit-ci@7.1.0 --moderate --config audit-ci.json
          echo "Dependency audit passed" >> $GITHUB_STEP_SUMMARY

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# JOB: Docker Build + Push
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  docker-build:
    name: "Docker Build and Push"
    runs-on: ubuntu-latest
    needs: [detect-changes, security]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Yarn
        run: npm install -g yarn@${{ env.YARN_VERSION }} --force

      - name: Validate Prisma schema/migration sync
        run: |
          node scripts/validate-prisma-generated.js --check-migration-sync
          echo "Prisma schema/migration sync OK" >> $GITHUB_STEP_SUMMARY

      - name: Validate Prisma configuration
        run: |
          test -f src/libs/infrastructure/database/prisma/schema.prisma || (echo "Schema file not found!" && exit 1)
          test -f src/libs/infrastructure/database/prisma/prisma.config.js || (echo "Config file not found!" && exit 1)
          yarn install --frozen-lockfile --ignore-scripts --silent
          export DATABASE_URL="${{ secrets.DATABASE_URL }}"
          yarn prisma format --schema=./src/libs/infrastructure/database/prisma/schema.prisma \
            --config=./src/libs/infrastructure/database/prisma/prisma.config.js \
            || (echo "Prisma schema validation failed!" && exit 1)
          echo "Prisma schema valid" >> $GITHUB_STEP_SUMMARY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name (lowercase)
        id: image
        run: |
          REPO_LOWER=$(echo "${{ env.IMAGE_REPO }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_FULL="ghcr.io/${REPO_LOWER}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE_FULL}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{branch}}-${{ github.sha }},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: devops/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          platforms: linux/amd64

      - name: Ensure SHA tag exists
        run: |
          IMAGE_BASE="${{ steps.image.outputs.image }}"
          EXPECTED_TAG="main-${{ github.sha }}"
          EXPECTED_IMAGE="${IMAGE_BASE}:${EXPECTED_TAG}"
          if echo "${{ steps.meta.outputs.tags }}" | grep -q "${EXPECTED_TAG}"; then
            echo "SHA tag already pushed: ${EXPECTED_TAG}"
          else
            FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep -v '^$' | head -n 1 | tr -d ' ')
            docker pull "${FIRST_TAG}"
            docker tag "${FIRST_TAG}" "${EXPECTED_IMAGE}"
            docker push "${EXPECTED_IMAGE}"
            echo "SHA tag pushed: ${EXPECTED_IMAGE}"
          fi

      - name: Verify image in registry
        run: |
          IMAGE_BASE="${{ steps.image.outputs.image }}"
          sleep 5
          if docker manifest inspect "${IMAGE_BASE}:main-${{ github.sha }}" > /dev/null 2>&1 || \
             docker manifest inspect "${IMAGE_BASE}:latest" > /dev/null 2>&1; then
            echo "Image verified in registry" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Image not found in registry after push"
            exit 1
          fi

      - name: Build Summary
        run: |
          echo "## Docker Build" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ steps.image.outputs.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA Tag**: main-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Pushed to GHCR" >> $GITHUB_STEP_SUMMARY

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# JOB: Infrastructure Health Check (parallel with docker-build)
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  ensure-infrastructure-health:
    name: "Infrastructure Health Check"
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    needs: [detect-changes, security]
    timeout-minutes: 10
    outputs:
      infra-healthy: ${{ steps.health-check.outputs.infra-healthy }}
      infra-status: ${{ steps.health-check.outputs.infra-status }}
      unhealthy-services: ${{ steps.health-check.outputs.unhealthy-services }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy health check scripts
        run: |
          scp ${{ env.SSH_OPTS }} devops/scripts/docker-infra/health-check.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/health-check.sh
          scp ${{ env.SSH_OPTS }} devops/scripts/shared/utils.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/utils.sh
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'chmod +x /tmp/health-check.sh /tmp/utils.sh'

      - name: Run infrastructure health check
        id: health-check
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            export SCRIPT_DIR="/tmp"
            /tmp/health-check.sh > /tmp/health-status.json 2>&1
            echo "EXIT_CODE=$?" > /tmp/health-exit.txt
            exit 0
          ENDSSH

          scp ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/health-status.json /tmp/health-status.json || true
          scp ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/health-exit.txt /tmp/health-exit.txt || true

          EXIT_CODE=$(grep EXIT_CODE /tmp/health-exit.txt 2>/dev/null | cut -d= -f2 || echo "1")

          if [[ "$EXIT_CODE" == "0" ]]; then
            echo "infra-healthy=true" >> $GITHUB_OUTPUT
            echo "infra-status=healthy" >> $GITHUB_OUTPUT
            echo "unhealthy-services=" >> $GITHUB_OUTPUT
          else
            echo "infra-healthy=false" >> $GITHUB_OUTPUT
            [[ "$EXIT_CODE" == "3" ]] && STATUS="missing" || STATUS="unhealthy"
            echo "infra-status=${STATUS}" >> $GITHUB_OUTPUT
            UNHEALTHY=$(jq -r '.services | to_entries | map(select(.value.status != "healthy")) | .[].key' /tmp/health-status.json 2>/dev/null | paste -sd,)
            echo "unhealthy-services=${UNHEALTHY}" >> $GITHUB_OUTPUT
          fi

      - name: Display health status
        run: |
          echo "## Infrastructure Health" >> $GITHUB_STEP_SUMMARY
          echo "- **Healthy**: ${{ steps.health-check.outputs.infra-healthy }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ steps.health-check.outputs.infra-status }}" >> $GITHUB_STEP_SUMMARY
          SERVICES="${{ steps.health-check.outputs.unhealthy-services }}"
          [[ -n "$SERVICES" ]] && echo "- **Unhealthy**: ${SERVICES}" >> $GITHUB_STEP_SUMMARY
          cat /tmp/health-status.json 2>/dev/null || true

      - name: Fail if unhealthy (triggers recovery jobs)
        if: steps.health-check.outputs.infra-healthy != 'true'
        run: |
          echo "::error::Infrastructure unhealthy - recovery path will run"
          exit 1

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# JOB: Check Infrastructure (gate)
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  check-infrastructure:
    name: "Infrastructure Gate"
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.ensure-infrastructure-health.result == 'success' || needs.ensure-infrastructure-health.result == 'failure')
    environment: production
    needs: [docker-build, ensure-infrastructure-health]
    timeout-minutes: 5
    outputs:
      infra-healthy: ${{ needs.ensure-infrastructure-health.outputs.infra-healthy }}
      infra-status: ${{ needs.ensure-infrastructure-health.outputs.infra-status }}
      unhealthy-services: ${{ needs.ensure-infrastructure-health.outputs.unhealthy-services }}
    steps:
      - name: Infrastructure gate decision
        run: |
          HEALTHY="${{ needs.ensure-infrastructure-health.outputs.infra-healthy }}"
          STATUS="${{ needs.ensure-infrastructure-health.outputs.infra-status }}"
          UNHEALTHY="${{ needs.ensure-infrastructure-health.outputs.unhealthy-services }}"

          echo "## Infrastructure Gate" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Healthy | ${HEALTHY} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unhealthy Services | ${UNHEALTHY:-none} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${HEALTHY}" == "true" ]]; then
            echo "HEALTHY PATH: deploy will only restart api + worker" >> $GITHUB_STEP_SUMMARY
          else
            echo "RECOVERY PATH: backup -> recreate (${UNHEALTHY:-all}) -> restore -> verify -> deploy" >> $GITHUB_STEP_SUMMARY
            echo "::warning::Infrastructure unhealthy. Recovery flow running."
            exit 1
          fi

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# JOB: Backup Infrastructure (RECOVERY ONLY)
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  backup-infrastructure:
    name: "Backup Before Recreate"
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.check-infrastructure.result == 'failure'
    environment: production
    needs: [detect-changes, check-infrastructure]
    timeout-minutes: 30
    outputs:
      backup-id: ${{ steps.backup.outputs.backup-id }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy backup scripts
        run: |
          scp ${{ env.SSH_OPTS }} devops/scripts/docker-infra/backup.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/backup.sh
          scp ${{ env.SSH_OPTS }} devops/scripts/shared/utils.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/utils.sh

      - name: Run pre-recreate backup
        id: backup
        continue-on-error: true
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            export SCRIPT_DIR="/tmp"
            export BASE_DIR="${{ secrets.SERVER_DEPLOY_PATH }}"
            source /tmp/utils.sh
            export S3_ENABLED="${{ vars.S3_ENABLED }}"
            export S3_ENDPOINT="${{ vars.S3_ENDPOINT }}"
            export S3_REGION="${{ vars.S3_REGION }}"
            export S3_BUCKET="${{ vars.S3_BUCKET }}"
            export S3_ACCESS_KEY_ID="${{ secrets.S3_ACCESS_KEY_ID }}"
            export S3_SECRET_ACCESS_KEY="${{ secrets.S3_SECRET_ACCESS_KEY }}"
            export S3_FORCE_PATH_STYLE="${{ vars.S3_FORCE_PATH_STYLE }}"
            command -v rclone &>/dev/null || (curl -fsSL https://rclone.org/install.sh | sudo bash) || true
            # Ensure postgres up for backup
            docker ps --format '{{.Names}}' | grep -q "^postgres$" || {
              cd "${{ secrets.SERVER_DEPLOY_PATH }}/devops/docker"
              docker compose -f docker-compose.prod.yml up -d postgres
              for i in $(seq 1 30); do
                docker exec postgres pg_isready -U postgres -d userdb >/dev/null 2>&1 && break
                sleep 2
              done
            }
            docker ps --format '{{.Names}}' | grep -q "^dragonfly$" || {
              cd "${{ secrets.SERVER_DEPLOY_PATH }}/devops/docker"
              docker compose -f docker-compose.prod.yml up -d dragonfly || true
            }
            chmod +x /tmp/backup.sh
            BACKUP_ID=$(/tmp/backup.sh pre-deployment)
            echo "BACKUP_ID=${BACKUP_ID}" > /tmp/backup-id.txt
            echo "Backup created: ${BACKUP_ID}"
          ENDSSH

          scp ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/backup-id.txt /tmp/backup-id.txt || true
          BACKUP_ID=$(grep BACKUP_ID /tmp/backup-id.txt 2>/dev/null | cut -d= -f2 || echo "")
          echo "backup-id=${BACKUP_ID}" >> $GITHUB_OUTPUT

          echo "## Pre-Recreate Backup" >> $GITHUB_STEP_SUMMARY
          echo "- **Backup ID**: ${BACKUP_ID:-failed}" >> $GITHUB_STEP_SUMMARY
          [[ -n "$BACKUP_ID" ]] && echo "- **Status**: Success" >> $GITHUB_STEP_SUMMARY || echo "- **Status**: Failed (pipeline continues)" >> $GITHUB_STEP_SUMMARY

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# JOB: Recreate Infrastructure (RECOVERY ONLY)
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  recreate-infrastructure:
    name: "Recreate Unhealthy Services"
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.check-infrastructure.result == 'failure' &&
      (needs.backup-infrastructure.result == 'success' || needs.backup-infrastructure.result == 'failure')
    environment: production
    needs: [detect-changes, check-infrastructure, backup-infrastructure]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy compose file
        run: |
          scp ${{ env.SSH_OPTS }} devops/docker/docker-compose.prod.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/docker-compose.prod.yml

      - name: Recreate only unhealthy infra services
        run: |
          UNHEALTHY="${{ needs.check-infrastructure.outputs.unhealthy-services }}"
          BACKUP_ID="${{ needs.backup-infrastructure.outputs.backup-id }}"
          echo "::notice::Recreating: ${UNHEALTHY:-all infra (postgres dragonfly)}"
          [[ -z "$BACKUP_ID" ]] && echo "::warning::No backup-id - restore step will be skipped"

          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            cp /tmp/docker-compose.prod.yml ${{ secrets.SERVER_DEPLOY_PATH }}/devops/docker/docker-compose.prod.yml
            cd ${{ secrets.SERVER_DEPLOY_PATH }}/devops/docker
            UNHEALTHY_SERVICES="${UNHEALTHY}"

            if [[ -n "\${UNHEALTHY_SERVICES}" ]]; then
              echo "Targeted recreate: \${UNHEALTHY_SERVICES}"
              docker compose -f docker-compose.prod.yml pull \${UNHEALTHY_SERVICES//,/ } --quiet || true

              if echo "\${UNHEALTHY_SERVICES}" | grep -q "postgres"; then
                echo "Patching PostgreSQL config (remove autovacuum_worker_slots)..."
                PG_VOL=\$(docker volume ls -q | grep postgres_data | head -1)
                [[ -n "\$PG_VOL" ]] && docker run --rm -v "\${PG_VOL}:/v" alpine sh -c \
                  "test -f /v/pgdata/postgresql.conf && sed -i.bak '/autovacuum_worker_slots/d' /v/pgdata/postgresql.conf; exit 0" || true
              fi

              for svc in \$(echo "\${UNHEALTHY_SERVICES}" | tr ',' ' '); do
                svc=\$(echo "\$svc" | tr -d ' ')
                [[ -z "\$svc" ]] && continue
                echo "Stopping+removing: \$svc"
                docker compose -f docker-compose.prod.yml stop "\$svc" 2>/dev/null || true
                docker compose -f docker-compose.prod.yml rm -f "\$svc" 2>/dev/null || true
                echo "Recreating: \$svc"
                docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps "\$svc" || {
                  echo "Failed to recreate \$svc"
                  exit 1
                }
              done
            else
              echo "Fallback: recreating all infra (postgres + dragonfly)"
              mkdir -p ${{ secrets.SERVER_DEPLOY_PATH }}/data/postgres ${{ secrets.SERVER_DEPLOY_PATH }}/data/dragonfly
              docker compose -f docker-compose.prod.yml down --remove-orphans || true
              sleep 3
              PG_VOL=\$(docker volume ls -q | grep postgres_data | head -1)
              [[ -n "\$PG_VOL" ]] && docker run --rm -v "\${PG_VOL}:/v" alpine sh -c \
                "test -f /v/pgdata/postgresql.conf && sed -i.bak '/autovacuum_worker_slots/d' /v/pgdata/postgresql.conf; exit 0" || true
              docker compose -f docker-compose.prod.yml pull postgres dragonfly --quiet || true
              docker compose -f docker-compose.prod.yml up -d --force-recreate postgres dragonfly || {
                echo "Infrastructure recreation failed"
                exit 1
              }
            fi

            sleep 15
            # Wait for postgres
            if [[ -z "\${UNHEALTHY_SERVICES}" ]] || echo "\${UNHEALTHY_SERVICES}" | grep -q "postgres"; then
              for i in \$(seq 1 30); do
                docker exec postgres pg_isready -U postgres -d userdb >/dev/null 2>&1 && { echo "PostgreSQL ready"; break; }
                [[ \$i -eq 30 ]] && { echo "PostgreSQL not ready"; exit 1; }
                sleep 2
              done
            fi
            # Wait for dragonfly
            if [[ -z "\${UNHEALTHY_SERVICES}" ]] || echo "\${UNHEALTHY_SERVICES}" | grep -q "dragonfly"; then
              for i in \$(seq 1 20); do
                docker exec dragonfly redis-cli -p 6379 ping >/dev/null 2>&1 && { echo "Dragonfly ready"; break; }
                [[ \$i -eq 20 ]] && { echo "Dragonfly not ready (non-fatal)"; break; }
                sleep 2
              done
            fi

            echo "Container status:"
            docker compose -f docker-compose.prod.yml ps
            echo "Infrastructure recreation complete"
          ENDSSH

          echo "## Infrastructure Recreation" >> $GITHUB_STEP_SUMMARY
          echo "- **Recreated**: ${UNHEALTHY:-all infra}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Complete" >> $GITHUB_STEP_SUMMARY

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# JOB: Restore Backup (RECOVERY ONLY)
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  restore-backup:
    name: "Restore Backup Data"
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.check-infrastructure.result == 'failure' &&
      needs.backup-infrastructure.outputs.backup-id != ''
    environment: production
    needs: [check-infrastructure, backup-infrastructure, recreate-infrastructure]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy restore scripts
        run: |
          scp ${{ env.SSH_OPTS }} devops/scripts/docker-infra/restore.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/restore.sh
          scp ${{ env.SSH_OPTS }} devops/scripts/shared/utils.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/utils.sh

      - name: Restore from backup
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            export SCRIPT_DIR="/tmp"
            export BASE_DIR="${{ secrets.SERVER_DEPLOY_PATH }}"
            source /tmp/utils.sh
            export S3_ENABLED="${{ vars.S3_ENABLED }}"
            export S3_ENDPOINT="${{ vars.S3_ENDPOINT }}"
            export S3_REGION="${{ vars.S3_REGION }}"
            export S3_BUCKET="${{ vars.S3_BUCKET }}"
            export S3_ACCESS_KEY_ID="${{ secrets.S3_ACCESS_KEY_ID }}"
            export S3_SECRET_ACCESS_KEY="${{ secrets.S3_SECRET_ACCESS_KEY }}"
            export S3_FORCE_PATH_STYLE="${{ vars.S3_FORCE_PATH_STYLE }}"
            command -v rclone &>/dev/null || (curl -fsSL https://rclone.org/install.sh | sudo bash) || true
            chmod +x /tmp/restore.sh
            BACKUP_ID="${{ needs.backup-infrastructure.outputs.backup-id }}"
            if [[ ! "$BACKUP_ID" =~ ^[a-zA-Z0-9_-]+$ ]]; then
              echo "::error::Invalid backup ID"
              exit 1
            fi
            /tmp/restore.sh "$BACKUP_ID"
            echo "Restore completed for backup: $BACKUP_ID"
          ENDSSH

          echo "## Backup Restore" >> $GITHUB_STEP_SUMMARY
          echo "- **Backup ID**: ${{ needs.backup-infrastructure.outputs.backup-id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Restored" >> $GITHUB_STEP_SUMMARY

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# JOB: Verify Infrastructure Readiness (RECOVERY ONLY)
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  verify-infrastructure-readiness:
    name: "Verify Post-Recreation Health"
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.check-infrastructure.result == 'failure' &&
      (needs.recreate-infrastructure.result == 'success' || needs.recreate-infrastructure.result == 'failure')
    environment: production
    needs: [check-infrastructure, backup-infrastructure, recreate-infrastructure, restore-backup]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy health check script
        run: |
          scp ${{ env.SSH_OPTS }} devops/scripts/docker-infra/health-check.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/health-check.sh
          scp ${{ env.SSH_OPTS }} devops/scripts/shared/utils.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/utils.sh

      - name: Verify post-recreation health
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            export SCRIPT_DIR="/tmp"
            chmod +x /tmp/health-check.sh /tmp/utils.sh
            if /tmp/health-check.sh; then
              echo "Infrastructure healthy and ready for deployment"
            else
              echo "::error::Infrastructure health check failed post-recreation"
              exit 1
            fi
          ENDSSH
          echo "## Post-Recreation Verification" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Infrastructure healthy" >> $GITHUB_STEP_SUMMARY

# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# JOB: Deploy to Production
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  deploy:
    name: "Deploy to Production"
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.docker-build.result == 'success' &&
      (needs.check-infrastructure.result == 'success' || needs.verify-infrastructure-readiness.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    needs: [docker-build, check-infrastructure, verify-infrastructure-readiness]
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Build .env.production
        run: |
          mkdir -p /tmp
          env_file="/tmp/.env.production"
          cat > "$env_file" << ENVEOF
          NODE_ENV=${{ vars.NODE_ENV }}
          IS_DEV=${{ vars.IS_DEV }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          DRAGONFLY_HOST=${{ vars.DRAGONFLY_HOST }}
          DRAGONFLY_PORT=${{ vars.DRAGONFLY_PORT }}
          DRAGONFLY_KEY_PREFIX=${{ vars.DRAGONFLY_KEY_PREFIX }}
          DRAGONFLY_PASSWORD=${{ secrets.DRAGONFLY_PASSWORD }}
          REDIS_HOST=${{ vars.REDIS_HOST }}
          REDIS_PORT=${{ vars.REDIS_PORT }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          PORT=${{ vars.PORT }}
          HOST=${{ vars.HOST }}
          BASE_URL=${{ vars.BASE_URL }}
          FRONTEND_URL=${{ vars.FRONTEND_URL }}
          MAIN_DOMAIN=${{ vars.MAIN_DOMAIN }}
          API_DOMAIN=${{ vars.API_DOMAIN }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}
          COMMUNICATION_ENCRYPTION_KEY=${{ secrets.COMMUNICATION_ENCRYPTION_KEY }}
          QR_SECRET_KEY=${{ secrets.QR_SECRET_KEY }}
          LOG_LEVEL=${{ vars.LOG_LEVEL }}
          ENABLE_AUDIT_LOGS=${{ vars.ENABLE_AUDIT_LOGS }}
          CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
          EMAIL_PROVIDER=${{ vars.EMAIL_PROVIDER }}
          ZEPTOMAIL_ENABLED=${{ vars.ZEPTOMAIL_ENABLED }}
          ZEPTOMAIL_SEND_MAIL_TOKEN=${{ secrets.ZEPTOMAIL_SEND_MAIL_TOKEN }}
          ZEPTOMAIL_FROM_EMAIL=${{ vars.ZEPTOMAIL_FROM_EMAIL }}
          ZEPTOMAIL_FROM_NAME=${{ vars.ZEPTOMAIL_FROM_NAME }}
          ZEPTOMAIL_WEBHOOK_SECRET=${{ secrets.ZEPTOMAIL_WEBHOOK_SECRET }}
          WHATSAPP_API_KEY=${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_PHONE_NUMBER_ID=${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_BUSINESS_ACCOUNT_ID=${{ vars.WHATSAPP_BUSINESS_ACCOUNT_ID }}
          WHATSAPP_OTP_TEMPLATE_ID=${{ vars.WHATSAPP_OTP_TEMPLATE_ID }}
          WHATSAPP_APPOINTMENT_CONFIRMATION_TEMPLATE_ID=${{ vars.WHATSAPP_APPOINTMENT_CONFIRMATION_TEMPLATE_ID }}
          WHATSAPP_APPOINTMENT_REMINDER_TEMPLATE_ID=${{ vars.WHATSAPP_APPOINTMENT_REMINDER_TEMPLATE_ID }}
          META_WHATSAPP_WEBHOOK_VERIFY_TOKEN=${{ secrets.META_WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          META_WHATSAPP_APP_SECRET=${{ secrets.META_WHATSAPP_APP_SECRET }}
          PAYMENT_ENABLED_PROVIDERS=${{ vars.PAYMENT_ENABLED_PROVIDERS }}
          CASHFREE_ENVIRONMENT=${{ vars.CASHFREE_ENVIRONMENT }}
          CASHFREE_APP_ID=${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY=${{ secrets.CASHFREE_SECRET_KEY }}
          CASHFREE_RETURN_URL=${{ vars.CASHFREE_RETURN_URL }}
          CASHFREE_NOTIFY_URL=${{ vars.CASHFREE_NOTIFY_URL }}
          PHONEPE_CLIENT_ID=${{ vars.PHONEPE_CLIENT_ID }}
          PHONEPE_CLIENT_SECRET=${{ secrets.PHONEPE_CLIENT_SECRET }}
          PHONEPE_ENVIRONMENT=${{ vars.PHONEPE_ENVIRONMENT }}
          PHONEPE_WEBHOOK_USERNAME=${{ vars.PHONEPE_WEBHOOK_USERNAME }}
          PHONEPE_WEBHOOK_PASSWORD=${{ secrets.PHONEPE_WEBHOOK_PASSWORD }}
          PHONEPE_WEBHOOK_AUTHORIZATION_HASH=${{ secrets.PHONEPE_WEBHOOK_AUTHORIZATION_HASH }}
          RAZORPAY_KEY_ID=${{ vars.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          PAYMENT_DEFAULT_CURRENCY=${{ vars.PAYMENT_DEFAULT_CURRENCY }}
          VIDEO_ENABLED=${{ vars.VIDEO_ENABLED }}
          VIDEO_PROVIDER=${{ vars.VIDEO_PROVIDER }}
          DAILY_API_KEY=${{ secrets.DAILY_API_KEY }}
          DAILY_DOMAIN=${{ vars.DAILY_DOMAIN }}
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID=${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI=${{ vars.GOOGLE_REDIRECT_URI }}
          FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_CLIENT_EMAIL=${{ vars.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_VAPID_KEY=${{ secrets.FIREBASE_VAPID_KEY }}
          S3_ENABLED=${{ vars.S3_ENABLED }}
          S3_PROVIDER=${{ vars.S3_PROVIDER }}
          S3_ENDPOINT=${{ vars.S3_ENDPOINT }}
          S3_REGION=${{ vars.S3_REGION }}
          S3_BUCKET=${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY=${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_FORCE_PATH_STYLE=${{ vars.S3_FORCE_PATH_STYLE }}
          ENABLE_BULL_BOARD=${{ vars.ENABLE_BULL_BOARD }}
          BULL_BOARD_URL=${{ vars.BULL_BOARD_URL }}
          QUEUE_DASHBOARD_USER=${{ vars.QUEUE_DASHBOARD_USER }}
          QUEUE_DASHBOARD_PASSWORD=${{ secrets.QUEUE_DASHBOARD_PASSWORD }}
          PRISMA_SCHEMA_PATH=${{ vars.PRISMA_SCHEMA_PATH }}
          DOCKER_ENV=true
          DOCKER_NETWORK=app-network
          ENABLE_HTTP2=false
          ENVEOF

      - name: Validate required env vars
        run: |
          declare -a REQUIRED=(
            DATABASE_URL JWT_SECRET JWT_REFRESH_SECRET SESSION_SECRET COOKIE_SECRET
            COMMUNICATION_ENCRYPTION_KEY REDIS_PASSWORD ZEPTOMAIL_SEND_MAIL_TOKEN
            WHATSAPP_API_KEY META_WHATSAPP_WEBHOOK_VERIFY_TOKEN META_WHATSAPP_APP_SECRET
            CASHFREE_APP_ID CASHFREE_SECRET_KEY PHONEPE_CLIENT_SECRET RAZORPAY_KEY_SECRET
            RAZORPAY_WEBHOOK_SECRET DAILY_API_KEY CLOUDFLARE_API_TOKEN GOOGLE_CLIENT_SECRET
            FIREBASE_PRIVATE_KEY FIREBASE_VAPID_KEY S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY
            QUEUE_DASHBOARD_PASSWORD
          )
          missing=()
          for key in "${REQUIRED[@]}"; do
            grep -Eq "^[[:space:]]*${key}=.+" /tmp/.env.production || missing+=("$key")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required env vars: ${missing[*]}"
            exit 1
          fi
          echo "All ${#REQUIRED[@]} required env vars present" >> $GITHUB_STEP_SUMMARY

      - name: Set deployment image
        id: deploy-image
        run: |
          REPO_LOWER=$(echo "${{ env.IMAGE_REPO }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LOWER}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Copy deployment files to server
        run: |
          # Scripts
          scp ${{ env.SSH_OPTS }} -r devops/scripts/shared devops/scripts/docker-infra \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DEPLOY_PATH }}/devops/scripts/
          # Env file
          scp ${{ env.SSH_OPTS }} /tmp/.env.production \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/.env.production
          # Compose file
          scp ${{ env.SSH_OPTS }} devops/docker/docker-compose.prod.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/docker-compose.prod.yml
          # Nginx config (for zero-downtime router)
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'mkdir -p ${{ secrets.SERVER_DEPLOY_PATH }}/nginx ${{ secrets.SERVER_DEPLOY_PATH }}/logs/nginx'
          scp ${{ env.SSH_OPTS }} devops/docker/nginx/nginx.conf \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DEPLOY_PATH }}/nginx/nginx.conf
          # Seed upstream.conf only if not already present (first deploy)
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'test -f ${{ secrets.SERVER_DEPLOY_PATH }}/nginx/upstream.conf || echo "server latest-api-blue:8088 max_fails=3 fail_timeout=10s;" > ${{ secrets.SERVER_DEPLOY_PATH }}/nginx/upstream.conf'

      - name: Zero-Downtime Deploy (Blue-Green API + Graceful Worker)
        run: |
          INFRA_HEALTHY="${{ needs.check-infrastructure.outputs.infra-healthy }}"
          DEPLOY_MODE="$([[ "$INFRA_HEALTHY" == 'true' ]] && echo 'healthy' || echo 'recovery')"
          echo "::notice::Deploy mode: ${DEPLOY_MODE} | Image: ${{ steps.deploy-image.outputs.image }}:main-${{ github.sha }}"

          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            set -e
            export DOCKER_IMAGE="${{ steps.deploy-image.outputs.image }}:main-${{ github.sha }}"
            export SERVER_DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH }}"
            export NGINX_UPSTREAM="${SERVER_DEPLOY_PATH}/nginx/upstream.conf"
            CURRENT_ACTIVE=$(docker ps --format '{{.Names}}' | grep -E '^latest-api-(blue|green)$' || true)
            if [ "$CURRENT_ACTIVE" == "latest-api-blue" ]; then
              ACTIVE="latest-api-blue"
              NEXT="latest-api-green"
            elif [ "$CURRENT_ACTIVE" == "latest-api-green" ]; then
              ACTIVE="latest-api-green"
              NEXT="latest-api-blue"
            else
              ACTIVE="latest-api-blue"
              NEXT="latest-api-green"
            fi
            echo "Current active: ${ACTIVE}, Deploying to: ${NEXT}"

            mkdir -p "${SERVER_DEPLOY_PATH}/backups/"{postgres,dragonfly,metadata}
            mkdir -p "${SERVER_DEPLOY_PATH}/data/"{postgres,dragonfly}
            mkdir -p "${SERVER_DEPLOY_PATH}/logs" "${SERVER_DEPLOY_PATH}/nginx"

            mv /tmp/.env.production "${SERVER_DEPLOY_PATH}/.env.production"
            chmod 600 "${SERVER_DEPLOY_PATH}/.env.production"
            mv /tmp/docker-compose.prod.yml "${SERVER_DEPLOY_PATH}/devops/docker/docker-compose.prod.yml"
            find "${SERVER_DEPLOY_PATH}/devops/scripts" -name '*.sh' -exec chmod +x {} \;

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            for attempt in 1 2 3 4 5; do
              docker pull "${DOCKER_IMAGE}" && break
              [[ $attempt -eq 5 ]] && { echo "Pull failed"; exit 1; }
              echo "Retry ${attempt}/5 in 10s..."; sleep 10
            done

            cd "${SERVER_DEPLOY_PATH}/devops/docker"
            docker run --rm --network app-network \
              --env-file "${SERVER_DEPLOY_PATH}/.env.production" \
              "${DOCKER_IMAGE}" \
              sh -c "node scripts/run-prisma.js migrate" \
              || echo "Migration: already up to date or non-fatal"

            # We will start nginx later, right before switching traffic, 
            # to avoid crashing if 'latest-api' doesn't exist yet on first deploy.

            # ZERO-DOWNTIME: Blue-Green API Deploy
            echo "=== ZERO-DOWNTIME DEPLOY START ==="
            docker rm -f "${NEXT}" 2>/dev/null || true

            # Force-kill ALL restarting containers (Docker blocks docker rm on them)
            # Previous failed deploys leave containers stuck in restart loops
            RESTARTING=$(docker ps -a --filter "status=restarting" --format '{{.ID}}' 2>/dev/null)
            if [ -n "${RESTARTING}" ]; then
              echo "Found restarting containers, force-killing:"
              echo "${RESTARTING}"
              echo "${RESTARTING}" | while read cid; do
                docker kill --signal=SIGKILL "${cid}" 2>/dev/null || true
              done
              sleep 3
            fi

            IS_ROLLING=false
            if [ -n "$CURRENT_ACTIVE" ]; then
              IS_ROLLING=true
            fi

            echo "Starting new container: ${NEXT}"
            docker run -d \
              --name "${NEXT}" \
              --hostname api \
              --network app-network \
              --env-file "${SERVER_DEPLOY_PATH}/.env.production" \
              -e NODE_ENV=production \
              -e DOCKER_ENV=true \
              -e DRAGONFLY_HOST=dragonfly \
              -e DRAGONFLY_PORT=6379 \
              -e TRUST_PROXY=1 \
              -e APP_MODE=api \
              -e PORT=8088 \
              -v /opt/healthcare-backend/logs:/app/logs \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              --health-cmd 'wget -q --spider http://localhost:8088/infra-health || exit 1' \
              --health-interval=10s \
              --health-retries=12 \
              --health-start-period=120s \
              --restart=unless-stopped \
              --label app.type=api \
              --label app.version="${{ github.sha }}" \
              "${DOCKER_IMAGE}"

            echo "Waiting for ${NEXT} to become healthy (max 3 min)..."
            HEALTHY=false
            for i in $(seq 1 36); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "${NEXT}" 2>/dev/null || echo "starting")
              echo "  [${i}/36] health: ${STATUS}"
              if [[ "$STATUS" == "healthy" ]]; then HEALTHY=true; break
              elif [[ "$STATUS" == "unhealthy" ]]; then
                echo "::error::New container unhealthy -- rollback"
                docker logs --tail=50 "${NEXT}" || true
                docker rm -f "${NEXT}"; exit 1
              fi
              sleep 5
            done

            if [[ "$HEALTHY" != "true" ]]; then
              echo "::error::Timeout -- rollback"
              docker logs --tail=50 "${NEXT}" || true
              docker rm -f "${NEXT}"; exit 1
            fi

            echo "${NEXT} healthy -- switching nginx upstream (zero downtime)"
            echo "server ${NEXT}:8088 max_fails=3 fail_timeout=10s;" > "${NGINX_UPSTREAM}"
            
            # Ensure nginx router is actually running before we exec into it.
            # docker ps can still show a container that is restarting, so check state explicitly.
            NGINX_STATUS=$(docker inspect --format='{{.State.Status}}' latest-nginx 2>/dev/null || true)
            NGINX_STATUS=${NGINX_STATUS:-missing}
            if [[ "$NGINX_STATUS" != "running" ]]; then
              echo "Starting nginx router (current status: ${NGINX_STATUS})..."
              docker rm -f latest-nginx 2>/dev/null || true
              docker compose -f "${SERVER_DEPLOY_PATH}/devops/docker/docker-compose.prod.yml" up -d --no-deps nginx
            fi

            for i in $(seq 1 15); do
              NGINX_STATUS=$(docker inspect --format='{{.State.Status}}' latest-nginx 2>/dev/null || true)
              NGINX_STATUS=${NGINX_STATUS:-missing}
              if [[ "$NGINX_STATUS" == "running" ]]; then
                break
              fi
              echo "Waiting for nginx router to be running (${i}/15)..."
              sleep 2
            done
            docker exec latest-nginx nginx -t || {
              echo "::error::nginx config test failed -- reverting"
              echo "--- NGINX LOGS ---"
              docker logs latest-nginx || true
              echo "------------------"
              echo "server ${ACTIVE}:8088 max_fails=3 fail_timeout=10s;" > "${NGINX_UPSTREAM}"
              docker rm -f "${NEXT}"; exit 1
            }
            docker exec latest-nginx nginx -s reload
            echo "nginx switched to ${NEXT}"
            sleep 2

            if [[ "$IS_ROLLING" == "true" ]]; then
              echo "Draining old container: ${ACTIVE} (30s)"
              docker stop "${ACTIVE}" --time=30 || true
              docker rm "${ACTIVE}" || true
            fi

            docker rm -f "${ACTIVE}" 2>/dev/null || true
            echo "=== ZERO-DOWNTIME DEPLOY COMPLETE: ${NEXT} ==="

            # ZERO-DOWNTIME: Blue-Green Worker Deploy
            echo "=== ZERO-DOWNTIME WORKER DEPLOY START ==="
            CURRENT_WORKER_ACTIVE=$(docker ps --format '{{.Names}}' | grep -E '^latest-worker-(blue|green)$' || true)
            if [ "$CURRENT_WORKER_ACTIVE" == "latest-worker-blue" ]; then
              WORKER_ACTIVE="latest-worker-blue"
              WORKER_NEXT="latest-worker-green"
            elif [ "$CURRENT_WORKER_ACTIVE" == "latest-worker-green" ]; then
              WORKER_ACTIVE="latest-worker-green"
              WORKER_NEXT="latest-worker-blue"
            else
              WORKER_ACTIVE="latest-worker-blue"
              WORKER_NEXT="latest-worker-green"
            fi
            echo "Current worker active: ${WORKER_ACTIVE}, Deploying to: ${WORKER_NEXT}"

            # Stop and remove legacy single-worker first (frees the published port)
            docker rm -f latest-worker 2>/dev/null || true

            docker rm -f "${WORKER_NEXT}" 2>/dev/null || true

            echo "Starting new worker container: ${WORKER_NEXT}"
            docker run -d \
              --name "${WORKER_NEXT}" \
              --hostname worker \
              --network app-network \
              --env-file "${SERVER_DEPLOY_PATH}/.env.production" \
              -e NODE_ENV=production \
              -e DOCKER_ENV=true \
              -e DRAGONFLY_HOST=dragonfly \
              -e DRAGONFLY_PORT=6379 \
              -e APP_MODE=worker \
              -e PORT=8080 \
              -v /opt/healthcare-backend/logs:/app/logs \
              -p 9010:8080 \
              --health-cmd 'node dist/worker-bootstrap.js --healthcheck' \
              --health-interval=30s \
              --health-timeout=15s \
              --health-retries=12 \
              --health-start-period=120s \
              --restart=unless-stopped \
              --label app.type=worker \
              --label app.version="${{ github.sha }}" \
              "${DOCKER_IMAGE}"

            echo "Waiting for ${WORKER_NEXT} to become healthy (max 3 min)..."
            WORKER_HEALTHY=false
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "${WORKER_NEXT}" 2>/dev/null || echo "starting")
              echo "  [${i}/12] health: ${STATUS}"
              if [[ "$STATUS" == "healthy" ]]; then WORKER_HEALTHY=true; break
              elif [[ "$STATUS" == "unhealthy" ]]; then
                echo "::error::New worker container unhealthy -- rollback"
                docker logs --tail=50 "${WORKER_NEXT}" || true
                docker rm -f "${WORKER_NEXT}"; exit 1
              fi
              sleep 15
            done

            if [[ "$WORKER_HEALTHY" != "true" ]]; then
              echo "::error::Worker Timeout -- rollback"
              docker logs --tail=50 "${WORKER_NEXT}" || true
              docker rm -f "${WORKER_NEXT}"; exit 1
            fi

            if [ -n "$CURRENT_WORKER_ACTIVE" ]; then
              echo "Draining old worker container: ${WORKER_ACTIVE} (30s)"
              docker stop "${WORKER_ACTIVE}" --time=30 || true
              docker rm "${WORKER_ACTIVE}" || true
            fi
            
            # Catch old legacy non-blue/green worker just in case
            docker rm -f latest-worker 2>/dev/null || true

            echo "=== ZERO-DOWNTIME WORKER DEPLOY COMPLETE: ${WORKER_NEXT} ==="
            echo "Worker deployed"

            echo "Container status:"
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' | grep -E 'NAMES|latest-|postgres|dragonfly'
            echo "Zero-downtime deployment complete"
          ENDSSH

      - name: Deploy Summary
        run: |
          echo "## Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ steps.deploy-image.outputs.image }}:main-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy**: Blue-Green (zero downtime)" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: start new -> healthcheck -> nginx switch -> drain old (30s)" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker**: graceful restart (30s job drain)" >> $GITHUB_STEP_SUMMARY
          echo "- **Infra**: ${{ needs.check-infrastructure.outputs.infra-healthy == 'true' && 'untouched (healthy path)' || 'was recreated (recovery path)' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Deployed" >> $GITHUB_STEP_SUMMARY


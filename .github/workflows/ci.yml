# Multi-Environment CI/CD Pipeline — Healthcare Backend
#
# TRIGGER FLOW:
#   PR  to main        → lint/type-check (no deploy)
#   push to main       → detect → { security | verify | docker-build } → merge → deploy PRODUCTION
#                        (security, verify — lint/format/type-check/validation — and the
#                        image build run in parallel; image tags and the deploy wait for
#                        all three)
#
# There is no preprod environment: Temps hosts only the production project, so
# work merges straight into main. Pushes to other branches (including the old
# preprod branch) do not build or deploy.
#
# PR-to-main checks:
#   - Lint + type-check
#   - NO secrets, NO infra, NO deploy
#
# DEPLOY STRATEGY: Temps rolling deploy (see "Deploy via Temps API").
# ============================================================================

name: CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.svg"
      - "**/*.txt"

permissions:
  contents: read
  checks: write
  packages: write
  security-events: write
  actions: read
  pull-requests: read

env:
  NODE_VERSION: "24"
  YARN_VERSION: "1.22.22"
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository }}
  IMAGE_NAME: healthcare-api
  SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -i ~/.ssh/deploy_key"
  HEALTH_INTERVAL: 5
  DRAIN_INTERVAL: 5
  HEALTH_TIMEOUT: 180
  DRAIN_TIMEOUT: 120

# ============================================================================
# JOB: detect-changes — Identify infra vs app changes
# ============================================================================
jobs:
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      infra-changed: ${{ steps.filter.outputs.infra }}
      app-changed: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect infrastructure and application changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            infra:
              - 'devops/docker/docker-compose.prod.yml'
              - 'devops/docker/docker-compose.preprod.yml'
              - 'devops/docker/nginx/*'
              - 'devops/scripts/docker-infra/*'
              - 'src/libs/infrastructure/database/prisma/migrations/**'
            app:
              - 'src/**'
              - 'package.json'
              - 'yarn.lock'
              - 'tsconfig.json'
              - 'nest-cli.json'
              - 'devops/docker/Dockerfile'

      - name: Change Summary
        run: |
          echo "## Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "| Scope | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Infrastructure | ${{ steps.filter.outputs.infra }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Application | ${{ steps.filter.outputs.app }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB: pr-check — Fast validation for PRs targeting main (no deploy)
  # ============================================================================
  pr-check:
    name: "PR Validation"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Yarn
        run: npm install -g yarn@${{ env.YARN_VERSION }} --force

      - name: Install dependencies
        run: yarn install --frozen-lockfile --silent

      - name: Lint
        run: yarn lint:check

      - name: Type-check
        run: yarn type-check

      - name: PR check summary
        run: |
          echo "## PR Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB: security — Vulnerability scan + dependency audit (push only)
  # ============================================================================
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

      - name: Dependency Audit
        run: |
          npx audit-ci@7.1.0 --moderate --config audit-ci.json
          echo "Dependency audit passed" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB: verify — Lint, format, type-check and validation gate (push only)
  # ============================================================================
  # These checks used to run inside the Docker build (`RUN yarn build`), in series
  # in front of the compile. The image now runs only the compile step
  # (`yarn build:compile`), and the same checks run here, in parallel with
  # docker-build, against the same commit. They still gate publishing:
  # docker-build-merge (which creates the `main-<sha>` and `latest` tags) and
  # deploy both need this job, so a failure here blocks the deploy exactly like a
  # failing `yarn build` inside the image build did.
  verify:
    name: "Verify (lint, format, type-check, validation)"
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.event_name == 'push'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install Yarn
        run: npm install -g yarn@${{ env.YARN_VERSION }} --force

      - name: Validate Prisma schema/migration sync
        run: |
          node scripts/validate-prisma-generated.js --check-migration-sync
          echo "Prisma schema/migration sync OK" >> $GITHUB_STEP_SUMMARY

      # Same flags as the Docker builder stage's install.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --ignore-engines --network-timeout 600000

      - name: Validate Prisma configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -f src/libs/infrastructure/database/prisma/schema.prisma || (echo "Schema file not found!" && exit 1)
          test -f src/libs/infrastructure/database/prisma/prisma.config.js || (echo "Config file not found!" && exit 1)
          yarn prisma format --schema=./src/libs/infrastructure/database/prisma/schema.prisma \
            --config=./src/libs/infrastructure/database/prisma/prisma.config.js \
            || (echo "Prisma schema validation failed!" && exit 1)
          echo "Prisma schema valid" >> $GITHUB_STEP_SUMMARY

      # type-check needs the generated client, exactly as in the Docker builder stage
      # (placeholder URL: generate never connects).
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@db:5432/placeholder?schema=public
        run: yarn prisma:generate

      # Every validation step of `yarn build`, on the committed source (no ESLint --fix /
      # Prettier --write pass first: the image is compiled from the committed source, so that
      # is what must pass). BUILD_ENV=development is the environment `yarn build` resolved
      # inside the Docker builder (no NODE_ENV / CI there), so env:validate applies the same
      # rules it always has.
      - name: Lint, format, type-check and validation checks
        env:
          BUILD_ENV: development
        run: yarn build:checks

  # ============================================================================
  # JOB: docker-build — Build and push by digest
  # ============================================================================
  # amd64-only: every node that actually runs this image (temps-worker-ubuntu,
  # contabo-ds, contabo-healthcare, test-x86-micro) is amd64. The last arm64
  # node (oracle-main) was decommissioned; building that platform further would
  # just produce an image nothing deploys to. Still matrixed/digest-merged
  # (see docker-build-merge below) so a second platform can be added back the
  # same way if an arm64 node ever rejoins.
  # Runs in parallel with security and verify instead of after security: it only
  # pushes an untagged digest, and docker-build-merge (tags) + deploy need all three.
  # The explicit push-only `if` replaces the one this job used to inherit from
  # needing `security` (which is push-only), so PRs still never build the image.
  docker-build:
    name: "Docker Build and Push (${{ matrix.platform }})"
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: github.event_name == 'push'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64]
    outputs:
      image_name: ${{ steps.image.outputs.image }}
    steps:
      # The Prisma schema/migration-sync and schema-format validations that used to run
      # here (with their own uncached ~70s yarn install) moved to the `verify` job, which
      # gates the image tags and the deploy the same way.
      - uses: actions/checkout@v4

      - name: Set platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      # cleanup: false skips the post-job `docker buildx rm` of the BuildKit container
      # (~30s on the last runs). GitHub-hosted runners are discarded after the job anyway;
      # revisit if this job ever moves to a self-hosted runner.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          cleanup: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name (lowercase)
        id: image
        run: |
          REPO_LOWER=$(echo "${{ env.IMAGE_REPO }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_FULL="ghcr.io/${REPO_LOWER}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE_FULL}" >> $GITHUB_OUTPUT

      - name: Extract metadata (labels only — tags are decided in the merge job)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: devops/docker/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=build-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=build-${{ env.PLATFORM_PAIR }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # JOB: docker-build-merge — Combine per-platform digests into one multi-arch tag
  # ============================================================================
  docker-build-merge:
    name: "Docker Build and Push (Merge Manifest)"
    runs-on: ubuntu-latest
    # security + verify gate the tags: docker-build only pushes an untagged digest, and this
    # job is what publishes `main-<sha>` / `latest`, so nothing tagged exists until both passed.
    needs: [docker-build, security, verify]
    timeout-minutes: 10
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_name: ${{ needs.docker-build.outputs.image_name }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.docker-build.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.ref == 'refs/heads/main' && 'main' || 'preprod' }}-${{ github.sha }},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE_BASE="${{ needs.docker-build.outputs.image_name }}"
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_BASE}@sha256:%s " *)

      - name: Inspect merged image + summary
        run: |
          IMAGE_BASE="${{ needs.docker-build.outputs.image_name }}"
          EXPECTED_TAG="${{ github.ref == 'refs/heads/main' && 'main' || 'preprod' }}-${{ github.sha }}"
          docker buildx imagetools inspect "${IMAGE_BASE}:${EXPECTED_TAG}"
          echo "## Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ${EXPECTED_TAG} | \`${IMAGE_BASE}:${EXPECTED_TAG}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB: ensure-infrastructure-health — Check shared infra (push only)
  # ============================================================================
  ensure-infrastructure-health:
    name: "Ensure Infrastructure Health"
    runs-on: ubuntu-latest
    needs: [docker-build-merge]
    if: github.event_name == 'push'
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
    outputs:
      infra_healthy: ${{ steps.health.outputs.healthy }}
      infra_status: ${{ steps.health.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run infrastructure health check
        id: health
        continue-on-error: true
        env:
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
          CONTAINER_PREFIX: ${{ github.ref == 'refs/heads/main' && 'latest-' || 'preprod-' }}
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd '${DEPLOY_PATH}' && BASE_DIR='${DEPLOY_PATH}' DEPLOY_ENV='${DEPLOY_ENV}' CONTAINER_PREFIX='${CONTAINER_PREFIX}' devops/scripts/docker-infra/health-check.sh --env '${DEPLOY_ENV}'" > /tmp/health-result.json 2>&1 || true

          cat /tmp/health-result.json | sed 's/\\n/\n/g' > /tmp/health-pretty.json
          cat /tmp/health-pretty.json

          HEALTHY=$(cat /tmp/health-result.json | tr -d '\n' | grep -o '"status":"healthy"' || true)
          if [[ -n "$HEALTHY" ]]; then
            echo "healthy=true" >> $GITHUB_OUTPUT
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "healthy=false" >> $GITHUB_OUTPUT
            echo "status=unhealthy" >> $GITHUB_OUTPUT
          fi

      - name: Infra health summary
        run: |
          echo "Infrastructure health: ${{ steps.health.outputs.status }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB: pre-deployment-backup — Backup before deploy (push only)
  # ============================================================================
  pre-deployment-backup:
    name: "Pre-Deploy Backup"
    runs-on: ubuntu-latest
    needs: [ensure-infrastructure-health]
    if: github.event_name == 'push'
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run pre-deployment backup
        env:
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd '${DEPLOY_PATH}' && BASE_DIR='${DEPLOY_PATH}' bash devops/scripts/docker-infra/backup.sh pre-deployment" | tee /tmp/pre-deploy-backup.log

  # ============================================================================
  # JOB: deploy — Rolling deploy with sustained health verification (push only)
  # ============================================================================
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: [docker-build-merge, ensure-infrastructure-health, pre-deployment-backup, security, verify]
    if: github.event_name == 'push'
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
      cancel-in-progress: false
    outputs:
      deploy_status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via Temps API
        id: deploy
        env:
          DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
          IMAGE_FULL: ${{ needs.docker-build-merge.outputs.image_name }}:${{ github.ref == 'refs/heads/main' && 'main' || 'preprod' }}-${{ github.sha }}
          # Temps project/environment this image deploys into. Only the preprod
          # project exists today — a production Temps project isn't set up yet,
          # so production pushes stay gated off below until one is.
          TEMPS_PROJECT: ${{ github.ref == 'refs/heads/main' && vars.TEMPS_PROD_PROJECT || 'healthcarebackend' }}
          # Separate Temps project the Worker service lives in. Unlike
          # TEMPS_PROJECT above this isn't part of the prod/preprod cutover
          # gate — it's the one project that already exists either way.
          TEMPS_WORKER_PROJECT: ${{ github.ref == 'refs/heads/main' && vars.TEMPS_WORKER_PROD_PROJECT || 'healthcarebackend-worker' }}
          TEMPS_ENVIRONMENT: production
        run: |
          echo "Deploying to: ${DEPLOY_ENV} (image: ${IMAGE_FULL})"

          # ── Gate: production deploys disabled until a Temps prod project exists ──
          if [ "${DEPLOY_ENV}" = "production" ]; then
            if [ "${{ vars.ENABLE_PROD_DEPLOY || 'true' }}" != "true" ] || [ -z "${TEMPS_PROJECT}" ]; then
              echo "::warning::Production deploys are gated off (no Temps production project configured yet)."
              echo "Skipping production deploy — preprod not yet validated on Temps."
              exit 0
            fi
            echo "Production deploys are ENABLED."
          fi

          # ── Deploy via Temps: run the CLI on the control-plane host itself
          # (loopback API context) so the deploy call never has to cross
          # Cloudflare's upload-size limit. `deploy:image` has Temps pull
          # straight from GHCR (it already holds GHCR credentials) rather
          # than uploading the image through the CLI as `deploy:local-image`
          # did — same no-size-limit benefit, but it also keeps the real
          # `ghcr.io/...` tag as the deployment's image_name instead of
          # rewriting it to an opaque `temps.internal/...:immutable`
          # reference, which is what the app's own dashboard reads for its
          # "Image" / "Built" display (2026-11-04). Deploys both the API and
          # Worker projects — the Worker container picks its own entrypoint
          # at startup via APP_MODE (see devops/docker/Dockerfile), so this
          # needs no manual fix-up afterward. ──
          #
          # The API and Worker deploys are independent Temps projects, so they run in
          # parallel (they used to run one after the other: ~1.5 min + ~5 min). Each
          # deploy command is unchanged; its output is prefixed [api] / [worker], both
          # are always waited for, and the step fails if either one fails.
          # The first `npx` call only resolves/installs the CLI once, so the two
          # parallel `npx -y` calls don't race each other updating the same npx cache
          # entry when a new CLI version has been published.
          echo "Triggering Temps deploy (project=${TEMPS_PROJECT}, worker project=${TEMPS_WORKER_PROJECT}, environment=${TEMPS_ENVIRONMENT})..."
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -euo pipefail
            npx -y @temps-sdk/cli --version || true
            (
              npx -y @temps-sdk/cli --target-context temps-local deploy:image \
                --image '${IMAGE_FULL}' \
                -p '${TEMPS_PROJECT}' \
                -e '${TEMPS_ENVIRONMENT}' \
                -y --timeout 600 2>&1 | sed -u 's/^/[api]    /'
            ) &
            api_pid=\$!
            (
              npx -y @temps-sdk/cli --target-context temps-local deploy:image \
                --image '${IMAGE_FULL}' \
                -p '${TEMPS_WORKER_PROJECT}' \
                -e '${TEMPS_ENVIRONMENT}' \
                -y --timeout 600 2>&1 | sed -u 's/^/[worker] /'
            ) &
            worker_pid=\$!
            api_rc=0
            worker_rc=0
            wait \$api_pid || api_rc=\$?
            wait \$worker_pid || worker_rc=\$?
            echo \"API deploy (${TEMPS_PROJECT}) exit code: \$api_rc\"
            echo \"Worker deploy (${TEMPS_WORKER_PROJECT}) exit code: \$worker_rc\"
            if [ \$api_rc -ne 0 ] || [ \$worker_rc -ne 0 ]; then
              echo 'Temps deploy failed (see the [api] / [worker] output above)'
              exit 1
            fi
          "

          echo "Temps deploy complete for ${DEPLOY_ENV}"

      - name: Record deploy status
        id: status
        if: always()
        run: |
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # JOB: post-deploy — Verify deployment health + trigger success backup
  # ============================================================================
  post-deploy:
    name: "Post-Deploy (Verify + Backup)"
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && needs.deploy.result == 'success'
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
    outputs:
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment
        id: resolve
        run: |
          DEPLOY_ENV="${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}"
          API_SUBDOMAIN="${{ github.ref == 'refs/heads/main' && vars.API_SUBDOMAIN || vars.API_SUBDOMAIN }}"
          DEPLOY_PATH="${{ secrets.SERVER_DEPLOY_PATH }}"
          echo "deploy_env=${DEPLOY_ENV}" >> $GITHUB_OUTPUT
          echo "api_subdomain=${API_SUBDOMAIN}" >> $GITHUB_OUTPUT
          echo "deploy_path=${DEPLOY_PATH}" >> $GITHUB_OUTPUT

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Verify deployment on VPS
        id: verify
        env:
          SSH_OPTS: ${{ vars.SSH_OPTS || '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' }}
          DEPLOY_PATH: ${{ steps.resolve.outputs.deploy_path }}
          CONTAINER_PREFIX: ${{ github.ref == 'refs/heads/main' && 'latest-' || 'preprod-' }}
          VPS_API_PORT: ${{ github.ref == 'refs/heads/main' && '8088' || '8090' }}
          DEPLOY_ENV: ${{ steps.resolve.outputs.deploy_env }}
        run: |
          echo "Running post-deploy verification (env: ${DEPLOY_ENV})..."
          echo "CONTAINER_PREFIX=${CONTAINER_PREFIX}"

          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd '${DEPLOY_PATH}' && \
            BASE_DIR='${DEPLOY_PATH}' \
            CONTAINER_PREFIX='${CONTAINER_PREFIX}' \
            DEPLOY_ENV='${DEPLOY_ENV}' \
            VPS_API_PORT='${VPS_API_PORT}' \
            bash devops/scripts/docker-infra/verify.sh deployment
          " && echo "verified=true" >> $GITHUB_OUTPUT || echo "verified=false" >> $GITHUB_OUTPUT

      - name: Trigger success backup on VPS
        if: ${{ steps.verify.outputs.verified == 'true' }}
        env:
          SSH_OPTS: ${{ vars.SSH_OPTS || '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null' }}
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd '${DEPLOY_PATH}' && BASE_DIR='${DEPLOY_PATH}' bash devops/scripts/docker-infra/backup.sh success"

  # ============================================================================
  # JOB: failure-recovery — Roll back after deployment or verification failure
  # ============================================================================
  failure-recovery:
    name: "Failure Recovery"
    runs-on: ubuntu-latest
    needs: [deploy, post-deploy]
    if: always() && (needs.deploy.result == 'failure' || needs.post-deploy.result == 'failure')
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preprod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Trigger VPS incident recovery
        env:
          DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd '${DEPLOY_PATH}' && BASE_DIR='${DEPLOY_PATH}' bash devops/scripts/docker-infra/incident-response.sh deployment-failed"

# JOB: Post-Deployment Verification + Success Backup
# â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  post-deployment-verification:
    name: "Verify and Success Backup"
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.deploy.result == 'success'
    environment: production
    needs: [deploy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy verification and backup scripts
        run: |
          scp ${{ env.SSH_OPTS }} devops/scripts/docker-infra/verify.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/verify.sh
          scp ${{ env.SSH_OPTS }} devops/scripts/docker-infra/backup.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/backup.sh
          scp ${{ env.SSH_OPTS }} devops/scripts/shared/utils.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/utils.sh

      - name: Verify deployment
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            export SCRIPT_DIR="/tmp"
            export BASE_DIR="${{ secrets.SERVER_DEPLOY_PATH }}"
            source /tmp/utils.sh
            chmod +x /tmp/verify.sh
            if /tmp/verify.sh deployment; then
              echo "Post-deployment verification passed"
            else
              echo "::error::Deployment verification failed"
              exit 1
            fi
          ENDSSH

      - name: Start success backup (async on server)
        run: |
          ssh ${{ env.SSH_OPTS }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            export SCRIPT_DIR="/tmp"
            export BASE_DIR="${{ secrets.SERVER_DEPLOY_PATH }}"
            source /tmp/utils.sh
            export S3_ENABLED="${{ vars.S3_ENABLED }}"
            export S3_ENDPOINT="${{ vars.S3_ENDPOINT }}"
            export S3_REGION="${{ vars.S3_REGION }}"
            export S3_BUCKET="${{ vars.S3_BUCKET }}"
            export S3_ACCESS_KEY_ID="${{ secrets.S3_ACCESS_KEY_ID }}"
            export S3_SECRET_ACCESS_KEY="${{ secrets.S3_SECRET_ACCESS_KEY }}"
            export S3_FORCE_PATH_STYLE="${{ vars.S3_FORCE_PATH_STYLE }}"
            command -v rclone &>/dev/null || (curl -fsSL https://rclone.org/install.sh | sudo bash) || true
            chmod +x /tmp/backup.sh
            nohup /tmp/backup.sh success >> /tmp/success-backup.log 2>&1 &
            echo "Success backup started (PID: $!)"
            echo "Monitor: tail -f /tmp/success-backup.log"
          ENDSSH

      - name: Final Summary
        run: |
          echo "## Post-Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Verification**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Success Backup**: Started async on server" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment successful!**" >> $GITHUB_STEP_SUMMARY

